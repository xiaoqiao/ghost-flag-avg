    <div id="menus"></div>

  </div>
</div>

<script>
  (function () {
    // 胶片颗粒贴图（运行时生成，避免外部图片）
    try {
      var c = document.createElement('canvas'); c.width = c.height = 180;
      var x = c.getContext('2d'), d = x.createImageData(180, 180);
      for (var i = 0; i < d.data.length; i += 4) { var v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 22; }
      x.putImageData(d, 0, 0);
      document.documentElement.style.setProperty('--grain', 'url(' + c.toDataURL() + ')');
    } catch (e) { /* 忽略 */ }
    GF.E.boot();
  })();
</script>
